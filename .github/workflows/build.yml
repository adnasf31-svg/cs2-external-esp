name: Build Luvi Client

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v1.1

    - name: Build Release x64
      run: |
        msbuild cs2-external-esp.sln /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143

    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: release-${{ github.run_number }}
        release_name: "Release Build #${{ github.run_number }}"
        body: "Luvi Client - Automated Build"
        draft: false
        prerelease: false
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    - name: Upload Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: cs2-external-esp
        path: |
          release/
          **/*.exe
